<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper Lab — Legends League</title>
<style>
:root{
  --bg:#10141a; --panel:#171c24; --panel2:#1e2530; --line:#2b323d;
  --ink:#eae6dc; --dim:#96a1b0; --dimmer:#5e6875;
  --pos:#5cbfa0; --neg:#e0806e; --accent:#2fb2c4; --accent2:#d99a52; --link:#7cb9d9;
  --hover:#182029; --sel:#17323b;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--link)}
header{border-top:2px solid var(--accent);border-bottom:1px solid var(--line);padding:13px 20px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--panel)}
h1{font-size:17px;margin:0;letter-spacing:.01em;font-weight:650}
h1 span{color:var(--accent)}
.sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:2px;padding:0 14px;background:var(--panel);
  border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;
  transition:color .15s ease,border-color .15s ease}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:18px 20px 80px;max-width:1500px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:6px 9px;border-radius:6px;font-size:13px;font-family:inherit;
  transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
input[type=search]{min-width:190px}
label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--dim);
  font-size:12.5px;cursor:pointer;user-select:none}
button.act{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:6px 11px;border-radius:6px;font-size:13px;cursor:pointer;
  transition:border-color .15s ease,color .15s ease}
button.act:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:right;padding:7px 8px;
  border-bottom:1px solid var(--line);color:var(--dim);font-weight:600;
  cursor:pointer;white-space:nowrap;font-size:11.5px;letter-spacing:.03em;
  text-transform:uppercase;z-index:2;transition:color .12s ease}
th:hover{color:var(--ink)}
th.l,td.l{text-align:left}
th.on{color:var(--accent)}
td{padding:5px 8px;border-bottom:1px solid #191e26;text-align:right;
  font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
td.l{font-family:inherit;font-size:13px}
tbody tr{transition:background .1s ease}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--sel)}
.name{cursor:pointer}
.name:hover{color:var(--accent)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.dim{color:var(--dim)}
.tag{font-size:10.5px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);
  color:var(--dim);margin-left:5px;vertical-align:1px;font-family:inherit}
.tag.keep{border-color:var(--pos);color:var(--pos)}
.tag.il{border-color:var(--neg);color:var(--neg)}
.tag.ext{border-color:var(--accent2);color:var(--accent2)}
.tag.role{border-color:var(--link);color:var(--link)}
.mlbteam{font-size:10.5px;color:var(--dimmer);border:1px solid var(--line);border-radius:3px;
  padding:0 4px}
.wrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:21px;font-family:var(--mono);margin-top:4px;font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:500}
.card .n{color:var(--dimmer);font-size:11.5px;margin-top:3px;line-height:1.35}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.panel h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--dim);font-weight:650;border-left:2px solid var(--accent);padding-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.qbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;transition:border-color .12s,background .12s}
.qbtn:hover{border-color:var(--accent);background:var(--hover)}
.qbtn:disabled{opacity:.45;cursor:not-allowed}
.qbtn:disabled:hover{border-color:var(--line);background:var(--panel2)}
.qbtn .qt{font-size:14px;font-weight:600}
.qbtn .qd{color:var(--dim);font-size:12px;margin-top:4px;line-height:1.35}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* On a phone the board keeps the six columns a keeper decision actually needs:
   who, what he costs, what he is worth, and the two surplus figures. */
@media(max-width:700px){
  main{padding:14px 10px 60px}
  #tbl th:nth-child(2),#tbl td:nth-child(2),
  #tbl th:nth-child(3),#tbl td:nth-child(3),
  #tbl th:nth-child(5),#tbl td:nth-child(5),
  #tbl th:nth-child(7),#tbl td:nth-child(7),
  #tbl th:nth-child(9),#tbl td:nth-child(9),
  #tbl th:nth-child(10),#tbl td:nth-child(10),
  #tbl th:nth-child(13),#tbl td:nth-child(13),
  #tbl th:nth-child(14),#tbl td:nth-child(14),
  #tbl th:nth-child(15),#tbl td:nth-child(15){display:none}
  .wrap{max-height:none}
  input[type=search]{min-width:0;flex:1 1 100%}
}
#drawer{position:fixed;top:0;right:0;width:min(470px,100%);height:100%;background:var(--panel);
  border-left:1px solid var(--line);padding:20px;overflow:auto;transform:translateX(102%);
  transition:transform .18s ease;z-index:50;box-shadow:-14px 0 34px rgba(0,0,0,.45)}
#drawer.on{transform:none}
#drawer h2{margin:0 0 2px;font-size:19px;letter-spacing:.005em}
#drawer .close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--dim);
  font-size:20px;line-height:1;background:none;border:0;transition:color .15s ease}
#drawer .close:hover{color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px;margin:6px 0 2px}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.note{color:var(--dimmer);font-size:12px;line-height:1.55;margin-top:8px}
.pick{display:flex;gap:5px;flex-wrap:wrap;min-height:30px;margin-top:7px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:13px;
  padding:2.5px 9px;font-size:12px;cursor:pointer;transition:border-color .15s ease,color .15s ease}
.chip:hover{border-color:var(--neg);color:var(--neg)}
.picker{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:7px}
.picker div{padding:4px 9px;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;
  transition:background .1s ease}
.picker div:hover{background:var(--hover)}
.picker div.taken{opacity:.35;pointer-events:none}
.sugg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.sugg-grid{grid-template-columns:1fr}}
.sugg-card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.sugg-card.dim{opacity:.55}
.verdict{font-size:16px;font-family:var(--mono);padding:9px 0;color:var(--ink);font-weight:500}
.bars{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
footer{color:var(--dimmer);font-size:11.5px;padding:0 20px 30px;max-width:1000px;line-height:1.6}
code{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel2);
  padding:1px 4px;border-radius:3px}
.wrap::-webkit-scrollbar,.picker::-webkit-scrollbar{width:9px;height:9px}
.wrap::-webkit-scrollbar-track,.picker::-webkit-scrollbar-track{background:transparent}
.wrap::-webkit-scrollbar-thumb,.picker::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.wrap::-webkit-scrollbar-thumb:hover,.picker::-webkit-scrollbar-thumb:hover{background:var(--dimmer)}
</style>
</head>
<body>
<header>
  <h1>Keeper <span>Lab</span></h1>
  <div class="sub" id="hdr"></div>
  <div class="sub" id="basisbar"></div>
</header>
<nav id="nav"></nav>
<main>
  <div id="view"></div>
</main>
<footer id="foot"></footer>

<div id="drawer"><button class="close" onclick="closeDrawer()">×</button><div id="dbody"></div></div>

<script>
const D = /*__DATA__*/null;
const IX = {}; D.cols.forEach((c,i)=>IX[c]=i);
const g = (r,c)=>r[IX[c]];
const CATS = D.cats, NEG = new Set(D.neg_cats);
const ROS = ["AB","H","HR","R","RBI","SB","IP","W","SV","K","ER","BB","H_allowed"];
const TEAMS = Object.keys(D.cur_totals);
const BOARD = D.board, FA = D.fa;
const byId = {}; BOARD.concat(FA).forEach(r=>byId[g(r,"fg_id")]=r);
const idByName = {}; BOARD.forEach(r=>idByName[g(r,"name")]=g(r,"fg_id"));
// Comp-based next-auction estimate (klab/auction_estimator.py), keyed by
// fg_id. A deliberately separate, non-integrated tool -- see its panel in
// showPlayer() -- reassigned wholesale by setBasis() since it's not present
// for every player, unlike BOARD/FA which always have full row coverage.
let AUCTION_EST = D.auction_estimates || {};
// ros_value_over_replacement per player, keyed [rosBasis][fg_id] -- powers
// the Keeper Board/Free Agents "ROS value" column. Varies by BOTH toggles
// (out/FINDINGS.md #46's _ros_values()), so reassigned wholesale by
// setBasis() same as AUCTION_EST, and read live by rosVal() per S.rosBasis
// rather than mutated into row arrays like the raw ros_* stat fields.
let ROS_VALUES = D.ros_values || {};
// 2027 standings projected from each team's keeper set alone, empty roster
// slots filled at replacement level (out/FINDINGS.md #49). Varies with
// PROJECTION_BASIS (the keeper set and its 2027 production both do), not
// with the rest-of-2026 toggle -- reassigned by setBasis() only.
let KEEPER_STANDINGS_2027 = D.keeper_standings_2027 || [];
const TRADE_SUGGESTIONS = D.trade_suggestions || [];
// Alternate 2026 rest-of-season signals (out/FINDINGS.md #45/#46): "ros"
// (ZiPS alone, default), "prorated" (season-to-date pace), "blend" (50/50).
// Independent of the projection-basis selector above -- this never touches
// a dollar value, only the ros_* fields rosterAgg() reads for the
// Standings tab and the Trade tab's win-now calc.
const ROS_VARIANTS = D.ros_variants || {};

// ---------- formatting ----------
const $ = (id)=>document.getElementById(id);
const nf = (v,d=1)=> v==null||!isFinite(v) ? "—" : v.toFixed(d);
const usd = (v,d=0)=> v==null||!isFinite(v) ? "—" : "$"+v.toFixed(d);
const sgn = (v,d=1,pre="")=>{
  if(v==null||!isFinite(v)) return '<span class="dim">—</span>';
  const c = v>0.0005?"pos":v<-0.0005?"neg":"dim";
  const s = v<-0.0005?"−":v>0.0005?"+":"";
  return `<span class="${c}">${s}${pre}${Math.abs(v).toFixed(d)}</span>`;
};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- shared state ----------
const S = {tab:"model", team:"", role:"", q:"", only:"", totals:false, sort:"surplus_multiyear",
           desc:true, fa:false, infl:false, basis: D.projection_basis || "blend",
           rosBasis: D.ros_basis_default || "ros", standSeason: "live", positional: false,
           shades: {}, intuitionQ: "", intuitionCalculated: false, contentionSeason: "2026"};
let INFL = D.constants.inflation || 1;   // reassigned by setBasis() below
const adj = v => S.infl && v!=null ? v/INFL : v;   // what a dollar of value costs in 2027 money

// ---------- projection basis ----------
// PROJECTION_BASIS is the model's biggest fork (out/ROADMAP.md 2.2): ~17%
// of keep/cut calls move depending on it. All three variants ship in the
// payload (klab/config.py's PROJECTION_BASIS values) so switching is a
// re-render, not a rebuild.
const BASES_ORDER = ["blend", "projection", "actuals"];
const BASIS_LABEL = {blend: "blend", projection: "projection only", actuals: "2026 only"};
const BASIS_HELP = "Which source drives every 2027 number on this page. "
  + "\"blend\" (default) mixes 2026 form with the ZiPS 2027 projection, weighted "
  + "by each stat's year-over-year reliability. \"projection only\" trusts ZiPS "
  + "2027 alone and ignores 2026 entirely. \"2026 only\" extrapolates this year's "
  + "actual performance and ignores the projection system entirely. About 17% of "
  + "keep/cut calls move depending on this choice.";
// ---------- positional adjustment ----------
// out/FINDINGS.md #52: prices catchers and shortstops off their own
// position's replacement level instead of the pooled one. Every basis
// carries both settings (D.basis_variants[b].positional_variants.off/on),
// same "all variants ship, switching is a re-render" approach as the basis
// selector above -- so this toggle and the basis selector must compose:
// switching either one has to reapply the other, not silently reset it.
const POSITIONAL_HELP = "Off (default) prices every player against one league-wide "
  + "replacement level. On prices catchers and shortstops against their own "
  + "position's replacement level instead, like a real draft board. Surprising "
  + "result on this league's data: both C and SS come out DEEPER than the pooled "
  + "line, not scarcer -- so turning this on mostly lowers catcher/shortstop values.";
function applyVariant(){
  const bv = D.basis_variants[S.basis];
  if(!bv) return;
  const pv = bv.positional_variants[S.positional ? "on" : "off"];
  BOARD.length = 0; BOARD.push(...pv.board);
  FA.length = 0; FA.push(...pv.fa);
  Object.keys(byId).forEach(k=>delete byId[k]);
  BOARD.concat(FA).forEach(r=>byId[g(r,"fg_id")]=r);
  Object.keys(idByName).forEach(k=>delete idByName[k]);
  BOARD.forEach(r=>idByName[g(r,"name")]=g(r,"fg_id"));
  D.teams.length = 0; D.teams.push(...pv.teams_raw);
  Object.keys(D.constants).forEach(k=>delete D.constants[k]);
  Object.assign(D.constants, pv.constants);
  INFL = D.constants.inflation || 1;
  // Not positional-aware (documented scope limit, out/FINDINGS.md #52) --
  // stay pinned to whichever basis is active, same for either setting of
  // S.positional.
  AUCTION_EST = bv.auction_estimates || {};
  ROS_VALUES = bv.ros_values || {};
  KEEPER_STANDINGS_2027 = bv.keeper_standings_2027 || [];
  renderHeader();
  // New board/fa rows always carry the default ("ros") rest-of-season
  // signal -- reapply whichever ros-basis toggle was active, or a switch
  // here would silently discard it. setRosBasis() renders, so this is the
  // last step.
  setRosBasis(S.rosBasis);
}
function setBasis(b){
  if(!D.basis_variants[b]) return;
  S.basis = b;
  applyVariant();
}
function setPositionalAdjustment(on){
  S.positional = !!on;
  applyVariant();
}

function setRosBasis(basis){
  if(!ROS_VARIANTS[basis]) return;
  S.rosBasis = basis;
  const v = ROS_VARIANTS[basis];
  for(const r of BOARD.concat(FA)){
    const rec = v[g(r,"fg_id")];
    if(!rec) continue;
    for(const c of ROS) r[IX["ros_"+c]] = rec[c] ?? 0;
  }
  recomputeProjections();
  render();
}

// ---------- roto engine (mirrors trade.win_now_delta) ----------
// shadeCols (optional, Intuition tab only -- see out/FINDINGS.md #50):
// {fg_id: {colName: multiplier, ...}}, unlisted columns default to 1. A
// per-column map, not one scalar per player, because "he's better" and
// "he's healthier" are different axes that shouldn't move the same stats
// the same way -- see buildShadeCols().
function rosterAgg(swap, shadeCols){
  const agg={}; TEAMS.forEach(t=>{agg[t]={};ROS.forEach(c=>agg[t][c]=0)});
  for(const r of BOARD){
    const id=g(r,"fg_id");
    const t = (swap && swap[id]) || g(r,"team");
    if(!agg[t]) continue;
    const cmap = shadeCols && shadeCols[id];
    for(const c of ROS){
      const mult = cmap && cmap[c]!=null ? cmap[c] : 1;
      agg[t][c]+= (g(r,"ros_"+c)||0) * mult;
    }
  }
  return agg;
}
function catTotals(agg){
  const ab0=D.base26.AB, ip0=D.base26.IP, out={};
  for(const t of TEAMS){
    const a=agg[t], c=D.cur_totals[t];
    out[t]={R:c.R+a.R, HR:c.HR+a.HR, RBI:c.RBI+a.RBI, SB:c.SB+a.SB,
            W:c.W+a.W, SV:c.SV+a.SV, K:c.K+a.K,
            AVG:(c.AVG*ab0+a.H)/(ab0+a.AB),
            ERA:(c.ERA*ip0/9+a.ER)*9/(ip0+a.IP),
            WHIP:(c.WHIP*ip0+a.BB+a.H_allowed)/(ip0+a.IP)};
  }
  return out;
}
function rankAvg(entries, asc){
  const s=[...entries].sort((a,b)=> asc ? a[1]-b[1] : b[1]-a[1]);
  const out={}; let i=0;
  while(i<s.length){
    let j=i; while(j+1<s.length && s[j+1][1]===s[i][1]) j++;
    const r=(i+1+j+1)/2;
    for(let k=i;k<=j;k++) out[s[k][0]]=r;
    i=j+1;
  }
  return out;
}
function rotoPoints(tot){
  const pts={}; TEAMS.forEach(t=>pts[t]={TOTAL:0});
  for(const c of CATS){
    const rk=rankAvg(TEAMS.map(t=>[t,tot[t][c]]), !NEG.has(c));
    TEAMS.forEach(t=>{pts[t][c]=rk[t]; pts[t].TOTAL+=rk[t];});
  }
  return pts;
}
let PROJ_PTS = rotoPoints(catTotals(rosterAgg(null)));
let PROJ_TOT = catTotals(rosterAgg(null));
function recomputeProjections(){   // re-run after setRosBasis() changes ros_* fields
  PROJ_TOT = catTotals(rosterAgg(null));
  PROJ_PTS = rotoPoints(PROJ_TOT);
}

// ---------- Monte Carlo finish odds (out/ROADMAP.md Phase 5) -------------
// This league pays 50%/25%/15%/breakeven for 1st-4th (D.finish_sim.
// payout_spots/payout_share) -- corrected 2026-08-14 from an earlier,
// wrong top-2-only build. A point ESTIMATE of final standings ("PROJ_PTS"
// above) answers the wrong question regardless of exactly how many places
// pay: what matters is how OFTEN a team actually finishes in the money,
// given real player-outcome uncertainty. Mirrors klab/standings_sim.py
// exactly (same shock mechanism, same category-reliability scaling, same
// SV-uses-W's-reliability convention) so the two stay consistent --
// verified statistically, not byte-for-byte, in app/verify.mjs (a Monte
// Carlo result can't be byte-matched between two different RNGs, so that
// check confirms the two AGREE within sampling noise, not that they're
// identical draw for draw).
//
// Reuses rosterAgg(swap, shadeCols) as-is: that function already supports
// BOTH a team-swap override (for a hypothetical trade) and a per-player,
// per-category multiplier map (built for the Intuition tab) at once, so
// one simulator function serves both the standalone Contention tab
// (swap=null) and the Trade tab's what-if view (swap={fg_id: newTeam}).
const SHOCK_CATEGORY = {H:"H", HR:"HR", R:"R", RBI:"RBI", SB:"SB",
                        W:"W", K:"K", ER:"ER", BB:"BB", H_allowed:"H"};
const DEFAULT_SHOCK_SCALE = 0.35;
// Box-Muller for a standard normal draw -- the only thing a random-normal
// library would be needed for here.
function randNormal(){
  let u=0, v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}
// One shared "hot/cold" draw per player -- a player running hot tends to
// run hot across HR/R/RBI together, not independently per stat -- scaled
// per category by (1 - reliability), so a less-reliable stat (pitcher
// wins) swings further for the same underlying shock than a more-reliable
// one (stolen bases). SV has no D.reliability entry (2027 saves come from
// a separate persistence model, never blended through reliability) and
// uses W's, the lowest real entry -- both are context/opportunity-driven,
// not skill-driven, and both are known to swing on a single role change.
function jitteredShadeCols(shockScale){
  const relMax = D.reliability_max;
  const svUnreliability = 1 - D.reliability.W/relMax;
  const unrel = {};
  for(const col in SHOCK_CATEGORY) unrel[col] = 1 - D.reliability[SHOCK_CATEGORY[col]]/relMax;
  const cols = {};
  for(const r of BOARD){
    const t = randNormal();
    const m = {};
    for(const col in unrel) m[col] = Math.max(0, 1 + t*shockScale*unrel[col]);
    m.SV = Math.max(0, 1 + t*shockScale*svUnreliability);
    cols[g(r,"fg_id")] = m;
  }
  return cols;
}
// swap: {fg_id: newTeam}, same shape rosterAgg() already takes -- null for
// "current rosters," set for "what if this trade happened." payoutSpots
// defaults to the league's real payout structure (D.finish_sim.
// payout_spots) so a future payout-structure change (this league has
// already gotten this wrong once -- see out/FINDINGS.md #55) touches one
// payload field, not a rewrite here.
function simulateFinishOdds(swap, B, shockScale, payoutSpots){
  B = B || 500;
  shockScale = shockScale==null ? DEFAULT_SHOCK_SCALE : shockScale;
  payoutSpots = payoutSpots || D.finish_sim.payout_spots;
  const finishCount = {};
  for(let place=1; place<=payoutSpots; place++){
    finishCount[place] = {};
    TEAMS.forEach(t=>finishCount[place][t]=0);
  }
  for(let i=0;i<B;i++){
    const shade = jitteredShadeCols(shockScale);
    const pts = rotoPoints(catTotals(rosterAgg(swap, shade)));
    const order = TEAMS.slice().sort((a,b)=>pts[b].TOTAL-pts[a].TOTAL);
    for(let place=1; place<=payoutSpots; place++) finishCount[place][order[place-1]]++;
  }
  const out = {};
  TEAMS.forEach(t=>{
    const row = {}; let money = 0;
    for(let place=1; place<=payoutSpots; place++){
      const p = finishCount[place][t]/B;
      row["p_finish_"+place] = p;
      money += p;
    }
    row.p_money = money;
    out[t] = row;
  });
  return out;
}

      + `${g(r,"role")==="PIT"?"pitcher":"hitter"} pool instead of ${g(r,"position")||"his position"} alone.`
    : `Based on the ${est.n_comps} most similar historical purchases at his position.`;

// ---------- generic sortable table ----------
// Every table on every tab sorts by clicking a header; a second click flips
// the direction. `cols` is [key, label, align, render, help].
function sortableTable(rows, cols, stateKey, note){
  const st = S[stateKey] || (S[stateKey] = {k: cols[1][0], desc: true});
  const sorted = rows.slice().sort((a,b)=>{
    let x=a[st.k], y=b[st.k];
    if(typeof x==="string"||typeof y==="string"){
      x=String(x??""); y=String(y??"");
      return st.desc ? y.localeCompare(x) : x.localeCompare(y);
    }
    x = (x==null||!isFinite(x)) ? -1e18 : x;
    y = (y==null||!isFinite(y)) ? -1e18 : y;
    return st.desc ? y-x : x-y;
  });
  const th = cols.map(([k,l,al,,help])=>
    `<th class="${al||""} ${st.k===k?"on":""}" onclick="reSort('${stateKey}','${k}')"`
    + ` title="${esc(help||"")} — click to sort">${l}${st.k===k?(st.desc?" ↓":" ↑"):""}</th>`).join("");
  const body = sorted.map(r=>"<tr>"+cols.map(([k,,al,render])=>
    `<td class="${al||""}">${render?render(r):r[k]}</td>`).join("")+"</tr>").join("");
  return `<div class="wrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`
    + (note?`<div class="note">${note}</div>`:"");
}
function reSort(stateKey,k){
  const st=S[stateKey];
  if(st.k===k) st.desc=!st.desc; else {st.k=k; st.desc=true;}
  render();
}

// This league pays 50%/25%/15%/breakeven for 1st-4th (D.finish_sim.
// payout_spots/payout_share), so a point-estimate "projected finish"
// (Standings tab) answers the wrong question. This tab answers the right
// one: how OFTEN does each team actually finish in the money, simulated
// many times over real player-outcome uncertainty (klab/standings_sim.py).
function contentionLabel(p){
  if(p>=0.50) return {text:"Contender", cls:"pos"};
  if(p>=0.05) return {text:"Bubble", cls:""};
  return {text:"Rebuild", cls:"neg"};
}
const PAYOUT_SPOTS = D.finish_sim.payout_spots;
function contentionHelp(is2027){
  const base = `Monte Carlo odds of finishing in the top ${PAYOUT_SPOTS}, the only places `
    + `this league pays out (1st 50% of the pot, 2nd 25%, 3rd 15%, 4th gets the buy-in back -- `
    + `4th is a break-even outcome, not a scaled-down version of winning, which this single `
    + `"in the money" figure doesn't distinguish). `;
  const scope = is2027
    ? `${D.keeper_finish_sim.draws} simulated 2027 seasons built from each team's CURRENT `
      + `keeper set alone plus replacement-level fill for every open roster slot -- keeper-core `
      + `strength, not a real-auction forecast (every team will also spend a full 2027 budget). `
    : `${D.finish_sim.draws} simulated rest-of-2026 seasons, jittering real player-outcome `
      + `uncertainty (a hot/cold stretch, not a denominator-fit question -- different `
      + `uncertainty source than the ± bands elsewhere in the app). `;
  return base + scope + "Contender: 50%+ chance of the money. Bubble: 5-50%. Rebuild: under "
    + "5%. Judgment-call thresholds, not a hard line.";
}
function contentionView(){
  const is2027 = S.contentionSeason === "2027";
  const zeroFinish = Object.fromEntries(Array.from({length:PAYOUT_SPOTS}, (_,i)=>[`p_finish_${i+1}`,0]));
  const basisData = is2027
    ? (D.basis_variants[S.basis].keeper_finish_odds || {})
    : (D.finish_odds[S.rosBasis] || D.finish_odds.ros);
  const nKeepByTeam = is2027
    ? Object.fromEntries((D.basis_variants[S.basis].keeper_standings_2027 || []).map(r=>[r.team, r.n_keep]))
    : {};
  const rows = TEAMS.map(t=>{
    const o = basisData[t] || {p_money:0, ...zeroFinish};
    const context = is2027 ? (nKeepByTeam[t] ?? 0) : (o.current_points ?? 0);
    return {team:t, context, ...o};
  });
  const placeCols = Array.from({length:PAYOUT_SPOTS}, (_,i)=>{
    const place = i+1, ord = place===1?"1st":place===2?"2nd":place===3?"3rd":`${place}th`;
    return [`p_finish_${place}`, `P(${ord})`, "", x=>`${nf(x[`p_finish_${place}`]*100,0)}%`,
      `Simulated odds of finishing exactly ${ord}.`];
  });
  const help = contentionHelp(is2027);
  const contextCol = is2027
    ? ["context","Keepers","",x=>x.context,"How many players are in this team's current 2027 keeper set."]
    : ["context","Points now","",x=>nf(x.context,1),"Roto points in the live 2026 standings."];
  const cols = [
    ["team","Team","l",x=>`<span class="name" onclick="S.tab='board';S.team=${JSON.stringify(esc(x.team))};render()">${esc(x.team)}</span>`,
      "Click to see this team's players."],
    contextCol,
    ["p_money","P(money)","",x=>{
        const lab = contentionLabel(x.p_money);
        return `${nf(x.p_money*100,0)}% <span class="${lab.cls}" style="font-size:11px;margin-left:4px">${lab.text}</span>`;
      }, help],
    ...placeCols,
  ];
  const seasonPicker = `<select onchange="S.contentionSeason=this.value;render()">
    <option value="2026" ${!is2027?"selected":""}>2026 — rest of season</option>
    <option value="2027" ${is2027?"selected":""}>2027 — keeper core</option>
  </select>`;
  return `<div class="bar">${seasonPicker}${is2027?"":rosBasisPicker()}</div>`
    + sortableTable(rows, cols, "sortContention"+S.contentionSeason, help
      + (is2027 ? " Change the \"projection basis\" dropdown in the header to see how the "
                 + "projection source moves this."
                : " Change the \"rest-of-2026 basis\" dropdown above to see how the signal "
                 + "driving this changes the picture."));
}

const SCENARIO_HINT = {

  challenge_trade: "both teams are live in the 2026 race with complementary category needs — a swap that raises BOTH teams' standings points",
  mutual_value_swap: "both teams are effectively out of 2026 — a dynasty-style trade where both sides' keeper value goes up",
};

function loadSuggestionFromBtn(btn){

function loadSuggestion(entryTeamA, aName, bName){
  // a_sends/b_sends are always relative to entry.team_a/entry.team_b, which
  // may not match whichever team is currently picker-side T.a vs T.b.
  const aGoesTo = entryTeamA === T.a ? "a" : "b";

function suggestedTradesPanel(){
  const entry = TRADE_SUGGESTIONS.find(e =>
    (e.team_a===T.a && e.team_b===T.b) || (e.team_a===T.b && e.team_b===T.a));
  if(!entry) return "";
  const cards = ["win_now_for_future","challenge_trade","mutual_value_swap"].map(key=>{
    const s = entry[key];
    if(!s) return `<div class="sugg-card dim"><b>${SCENARIO_LABEL[key]}</b><div style="font-size:12px">no trade cleared this bar for these two teams</div></div>`;

        + ` (+${s.buyer_standings_gain} 2026 pts) for <b>${esc(buyerSends)}</b>`
        + ` — <b>${esc(s.seller)}</b> +$${s.seller_surplus_gain} multi-yr surplus`;
    } else if(key==="challenge_trade"){
      detail = `<b>${esc(entry.team_a)}</b> sends <b>${esc(s.a_sends)}</b> (+${s.a_standings_gain} pts) ↔ `
        + `<b>${esc(entry.team_b)}</b> sends <b>${esc(s.b_sends)}</b> (+${s.b_standings_gain} pts)`;
    } else {
      detail = `<b>${esc(entry.team_a)}</b> sends <b>${esc(s.a_sends)}</b> (+$${s.a_surplus_gain}) ↔ `
        + `<b>${esc(entry.team_b)}</b> sends <b>${esc(s.b_sends)}</b> (+$${s.b_surplus_gain})`;

function tradeResult(){
  if(!T.aOut.length && !T.bOut.length)
    return `<div class="panel"><h3>Verdict</h3><div class="dim">Pick players on both sides.</div></div>`;
  const sum=(ids,col)=>ids.reduce((s,id)=>s+(g(byId[id],col)||0),0);
  const swap={}; T.aOut.forEach(id=>swap[id]=T.b); T.bOut.forEach(id=>swap[id]=T.a);
  const after=rotoPoints(catTotals(rosterAgg(swap)));
  // One 2026 standings point is priced at what a roto point costs at
  // auction, matching klab/trade.py::evaluate_trade -- not the redraft
  // scale, which is what d_surplus below uses. See out/FINDINGS.md #32.
  const usdpt=D.constants.usd_per_roto_point_auction;
  const cw=D.league.contention_weight;

  // Finish odds (out/ROADMAP.md Phase 5): this league pays the top
  // D.finish_sim.payout_spots places, so Δ standings points above isn't
  // actually the question that matters -- Δ P(money) is. "Before" reads
  // the SAME precomputed figure the Contention tab shows (not re-simulated
  // here, so the two screens can't disagree with each other); "after" is a
  // live simulation of this specific proposed swap, reusing the exact swap
  // map already built for the points math above.
  const moneyBefore = D.finish_odds[S.rosBasis] || D.finish_odds.ros;
  const moneyAfter = simulateFinishOdds(swap, 800);

  const block=(team,outIds,inIds)=>{
    const vIn=sum(inIds,"redraft_value"), vOut=sum(outIds,"redraft_value");
    const cIn=sum(inIds,"keeper_cost"),   cOut=sum(outIds,"keeper_cost");
    const dS=(vIn-cIn)-(vOut-cOut);
    const dMY=sum(inIds,"surplus_multiyear")-sum(outIds,"surplus_multiyear");
    const dP=after[team].TOTAL-PROJ_PTS[team].TOTAL;
    const score=dS + cw*dP*usdpt;
    const cats=CATS.map(c=>{
      const d=after[team][c]-PROJ_PTS[team][c];
      return Math.abs(d)<0.01?"":`${c} ${sgn(d,1)}`;
    }).filter(Boolean).join(" · ") || '<span class="dim">no category moves</span>';
    const pMoneyBefore = (moneyBefore[team] && moneyBefore[team].p_money) || 0;
    const pMoneyAfter = (moneyAfter[team] && moneyAfter[team].p_money) || 0;
    const dMoney = pMoneyAfter - pMoneyBefore;
    return `<div class="panel">
      <h3>${esc(team)}</h3>
      <div class="verdict">${sgn(adj(score),0,"$")} <span class="dim" style="font-size:12px">combined</span></div>
      <div class="kv">
        <div class="k">2027 value in / out</div><div class="v">${money(vIn)} / ${money(vOut)}</div>
        <div class="k">2027 salary in / out</div><div class="v">${usd(cIn)} / ${usd(cOut)}</div>
        <div class="k">Δ surplus, 2027</div><div class="v">${sgn(adj(dS),1,"$")}</div>
        <div class="k">Δ surplus, multi-year</div><div class="v">${sgn(adj(dMY),1,"$")}</div>
        <div class="k">Δ 2026 standings points</div><div class="v">${sgn(dP,1)}</div>
        <div class="k" title="This league pays the top ${D.finish_sim.payout_spots} places -- this is the trade's effect on how OFTEN this team actually lands there, not just its point total. Simulated live for this specific swap (klab/standings_sim.py, out/ROADMAP.md Phase 5).">Δ P(money), this trade</div>
        <div class="v">${sgn(dMoney*100,1)}pp <span class="dim" style="font-size:11px">(${nf(pMoneyBefore*100,0)}%→${nf(pMoneyAfter*100,0)}%)</span></div>
      </div>
      <div class="bars" style="margin-top:8px">${cats}</div>
    </div>`;
  };
  const others=TEAMS.filter(t=>t!==T.a&&t!==T.b)
    .map(t=>[t,after[t].TOTAL-PROJ_PTS[t].TOTAL]).filter(([t,d])=>Math.abs(d)>0.05);
  return `<div class="grid2">
      ${block(T.a,T.aOut,T.bOut)}
      ${block(T.b,T.bOut,T.aOut)}
    </div>
    <div class="panel"><h3>Collateral damage</h3>
      <div class="bars">${others.length
        ? others.map(([t,d])=>`${esc(t)} ${sgn(d,1)}`).join(" · ")
        : "no other team's standings move"}</div>
      <div class="note">Combined score = Δ2027 surplus + ${nf(cw,2)} × Δ2026 standings points ×
        $${nf(usdpt,2)}. The weight is the rebuilder's setting: a 2026 standings point is worth a
        quarter of a 2027 dollar. Slide it toward 1.0 if you are contending.</div>
    </div>`;
}

// ---------- model ----------
// Plain-English gloss for every Model-tab label, aimed at someone who
// isn't fluent in this project's jargon. Requested directly, 2026-08-13.
const CONST_HELP = {
  "usd_per_roto_point_auction": "What one standings point costs in a live auction, estimated by regressing what teams actually paid for players against how many points those players delivered. This is the number the trade evaluator uses to compare a dollar of value against a standings point.",
  "usd_per_roto_point_redraft": "A slightly different scale for the player-card “Worth” figures: what a point is worth if you drafted the player fresh today, not what an actual auction (with its own quirks, like saves being underpaid) says a specific player costs.",
  "auction_intercept": "A second, independent estimate of replacement level: what the auction-price regression predicts a $0 player would produce, in roto points. No one has ever actually paid $0 in this league (the minimum bid is $1) -- this is a straight-line extrapolation one dollar past the edge of the real data, which is exactly why out/FINDINGS.md #27 treats it as a LOWER-BOUND estimate, not the number the model actually prices players against (that's \"replacement level\" below, fit a different way). Deliberately never fit to match that number — when the two roughly agree, that's a real cross-check, not a coincidence.",
  "replacement_level": "How many roto points the best player you could add for free (off any team's bench or the waiver wire) actually produces. Every rostered player's dollar value is measured relative to this baseline, not to zero.",
  "budget_check": "A sanity check on the whole scale: this league has 10 teams × 23 active roster spots = 230 rostered players, and 10 teams × $260 = $2,600 total. If the top 230 projected players' dollar values don't sum close to $2,600, something upstream is miscalibrated.",
  "inflation": "How much more a dollar of talent costs in the real 2027 auction than the “fair value” redraft scale says — because keeper-league owners have already locked up a lot of cheap production, leaving less available talent chasing the same total budget.",
  "dollar_buys": "The flip side of inflation: how much redraft-scale value one real 2027 auction dollar actually buys, given that squeeze. Below 1.0× means a dollar buys less than face value.",
};
const SETTING_HELP = {
  "denom seasons": "Which past seasons' final standings are pooled to work out how many stats it takes to buy one standings point in each category.",
  "auction seasons": "Which past seasons' real auction prices are used to fit the $-per-roto-point conversion rate.",
  "exchange basis": "How the $/roto-point rate is fit. “keeper_adjusted” (default) accounts for how many players were already off the board as keepers in each of those past auctions, so the rate reflects the world 2027's auction will actually happen in, not an average of very different years.",
  "projection basis": "Which source drives every 2027 number on this page right now — the same fork as the header's “projection basis” dropdown. “blend” mixes 2026 form with the ZiPS 2027 projection; “projection” trusts ZiPS alone; “actuals” extrapolates 2026 alone.",
  "waiver value": "Which anchor sets replacement level, i.e. how good a “free” player is assumed to be. “low” (default, most generous to your own roster) uses the 230th-best projected player — one per active roster spot leaguewide. “high” uses what free-agent pickups actually produced in 2026, which overstates it since those players were picked up AFTER they got hot.",
  "positional adjustment": "Whether a scarce position (catcher, middle infield) gets a value bump over a common one for identical production. Off by default — not an oversight: tested directly, and the published evidence (FanGraphs' 13-system test, Razzball's four-stance test) both found it hurts more than it helps in a format like this one.",
  "future year discount": "How much a future season's keeper surplus is discounted per year further out (0.85 = 15% per year), because a contract you're free to decline is an option, not a locked-in obligation, and rosters/leagues drift.",
  "sv punt threshold": "Teams with fewer saves than this are assumed to be intentionally punting the category and are excluded before fitting how many saves buy a standings point — otherwise a couple of non-competing teams would distort what a save is worth for everyone else.",
  "max pt scale": "The most a player's projected playing time can be scaled up for the “if he plays a full season” upside figure on his player card. Beyond this, a bigger role isn't a reasonable extrapolation of this player — it'd effectively be projecting a different player.",
};

// ---------- intuition (manual player shading) ----------
// A personal "what if I think the model's wrong about this guy" layer,
// deliberately sandboxed: it never touches BOARD or any other tab's
// numbers (out/FINDINGS.md #50). Two axes, on purpose, not one:
// "talent" (is he actually better/worse than projected) moves his
// PRODUCTION RATE; "health" (assume no missed time) moves his PLAYING
// TIME. Conflating them would make "shade him up" ambiguous between "he'll
// play more" and "he'll play better."
const TALENT_SHADE_STEP = 0.05;
const TALENT_SHADE_MAX = 0.30;
// Flat, clearly-approximate rest-of-2026 volume boost for "force health" --
// not a real injury/return-date model (this league's data has none of
// that), just a labeled what-if.
const HEALTH_BOOST = 1.15;

function buildShadeCols(){
  const out = {};
  for(const [id, s] of Object.entries(S.shades)){
    const r = byId[id]; if(!r) continue;
    const isPit = g(r,"role")==="PIT";
    const healthMult = s.health ? HEALTH_BOOST : 1;
    const up = 1 + (s.talent||0);
    const down = 1/up;
    out[id] = isPit
      ? {IP:healthMult, W:healthMult*up, SV:healthMult*up, K:healthMult*up,
         ER:healthMult*down, BB:healthMult*down, H_allowed:healthMult*down}
      : {PA:healthMult, AB:healthMult, H:healthMult*up, HR:healthMult*up,
         R:healthMult*up, RBI:healthMult*up, SB:healthMult*up};
  }
  return out;
}
// Transparent LINEAR SCALING of the already-computed 2027 dollar value --
// explicitly NOT a re-run of the model. A true re-derivation needs the
// denominators, the roto scorer, and the auction exchange rate, all of
// which stay server-side on purpose (out/ARCHITECTURE.md §4.2) so this
// app never maintains two implementations of the valuation pipeline that
// can drift apart -- a real bug class this project has hit before.
// "Force health" reuses the ALREADY-COMPUTED full-time projection
// (redraft_value_ft) rather than inventing a second scale-up.
function shaded2027(r, s){
  const base = s.health ? (g(r,"redraft_value_ft")||g(r,"redraft_value")) : g(r,"redraft_value");
  const shadedVal = base * (1 + (s.talent||0));
  const deltaVal = shadedVal - g(r,"redraft_value");
  const shadedSurplus = g(r,"surplus_multiyear") + deltaVal;
  return {shadedVal, deltaVal, shadedSurplus};
}
// Per-player hover context requested for this tab (and, per Josh, as a
// general design rule: sortable/scannable numbers are columns, everything
// else is a tooltip so it doesn't clutter the table -- out/FINDINGS.md #50).
// No age anywhere: no file in data/ has one, same gap already stated for
// the auction estimator.
function playerTooltip(r){
  const isPit = g(r,"role")==="PIT";
  const cats = isPit ? D.pit_cats : D.hit_cats;
  const catLine = cats.map(c=>`${c} ${nf(g(r,"rp_"+c),2)}`).join(" · ");
  const rosLine = isPit
    ? `ROS: ${nf(g(r,"ros_IP"),0)} IP, ${nf(g(r,"ros_W"),0)}W/${nf(g(r,"ros_SV"),0)}SV/${nf(g(r,"ros_K"),0)}K`
    : `ROS: ${nf(g(r,"ros_AB"),0)} AB, ${nf(g(r,"ros_R"),0)}R/${nf(g(r,"ros_HR"),0)}HR/`
      +`${nf(g(r,"ros_RBI"),0)}RBI/${nf(g(r,"ros_SB"),0)}SB`;
  const lockNote = g(r,"keepable")===false ? " -- confirmed free agent, not extendable" : "";
  return `${g(r,"name")} · ${g(r,"team")} (${g(r,"mlb_team")||"?"}) · ${g(r,"position")||"?"}\n`
    +`Contract: ${g(r,"contract")}${lockNote}\n`
    +`2027 roto pts: ${nf(g(r,"roto_points"),2)} (${catLine})\n`
    +rosLine+`\n`
    +`Worth '27: ${money(g(r,"redraft_value"))} · Surplus, all yrs: ${sgn(adj(g(r,"surplus_multiyear")),0,"$")}`;
}

function addShadedPlayer(id){
  if(!S.shades[id]) S.shades[id] = {talent:0, health:false};
  S.intuitionCalculated = false;
  S.intuitionQ = "";
  render();
}
function removeShadedPlayer(id){
  delete S.shades[id];
  S.intuitionCalculated = false;
  render();
}
function bumpTalent(id, dir){
  const s = S.shades[id]; if(!s) return;
  s.talent = Math.max(-TALENT_SHADE_MAX, Math.min(TALENT_SHADE_MAX,
    Math.round((s.talent + dir*TALENT_SHADE_STEP)*100)/100));
  S.intuitionCalculated = false;
  render();
}
function toggleHealthShade(id){
  const s = S.shades[id]; if(!s) return;
  s.health = !s.health;
  S.intuitionCalculated = false;
  render();
}
function recalcIntuition(){ S.intuitionCalculated = true; render(); }

function intuitionView(){
  const q = S.intuitionQ.toLowerCase();
  const shadedIds = Object.keys(S.shades);
  const candidates = q.length>1
    ? BOARD.filter(r=>String(g(r,"name")).toLowerCase().includes(q) && !S.shades[g(r,"fg_id")]).slice(0,8)
    : [];
  const rows = shadedIds.map(id=>({r: byId[id], s: S.shades[id]})).filter(x=>x.r);

  const shadeTable = rows.length ? `<table><thead><tr>
      <th class="l">Player</th>
      <th class="l">Team</th>
      <th title="How much better (+) or worse (−) you think he'll actually perform, vs the model's own projection. Moves his production RATE (hits, HR, K, walks allowed, etc) -- not his playing time, which is the separate health control.">Talent shade</th>
      <th title="Assumes no missed time: swaps in the model's own \"full-time\" 2027 projection where available, and applies a flat +15% rest-of-2026 playing-time boost. Not a real injury/return-date model -- this league's data has none -- just a labeled what-if.">Force health</th>
      <th></th>
    </tr></thead><tbody>${rows.map(({r,s})=>`<tr>
      <td class="l"><span class="name" title="${esc(playerTooltip(r))}" onclick="showPlayer(${g(r,'fg_id')})">${esc(g(r,'name'))}</span></td>
      <td class="l dim">${esc(g(r,'team'))} <span class="mlbteam">${esc(g(r,'mlb_team'))}</span></td>
      <td><button class="act" onclick="bumpTalent(${g(r,'fg_id')},-1)">−</button>
        <span style="display:inline-block;width:46px;text-align:center;font-family:var(--mono)">${s.talent>0?"+":""}${(s.talent*100).toFixed(0)}%</span>
        <button class="act" onclick="bumpTalent(${g(r,'fg_id')},1)">+</button></td>
      <td><label class="chk"><input type="checkbox" ${s.health?"checked":""}
        onchange="toggleHealthShade(${g(r,'fg_id')})"></label></td>
      <td><span class="chip" onclick="removeShadedPlayer(${g(r,'fg_id')})">remove</span></td>
    </tr>`).join("")}</tbody></table>`
    : `<div class="dim" style="padding:6px 0 10px">Search a player below to start shading. Nothing
        recalculates until you press "recalculate."</div>`;

  let results = "";
  if(rows.length && S.intuitionCalculated){
    const shadeCols = buildShadeCols();
    const after = rotoPoints(catTotals(rosterAgg(null, shadeCols)));
    const teamsTouched = [...new Set(rows.map(({r})=>g(r,"team")))];
    const standRows = teamsTouched.map(t=>({
      team:t, before:PROJ_PTS[t].TOTAL, after:after[t].TOTAL,
      delta:after[t].TOTAL-PROJ_PTS[t].TOTAL,
    })).sort((a,b)=>b.delta-a.delta);
    const dollarRows = rows.map(({r,s})=>({r, ...shaded2027(r,s)}));

    results = `
      <div class="panel"><h3>2026 rest-of-season standings impact</h3>
        <div class="note">Full re-run of the same win-now engine the Trade tab uses, with your
          shaded inputs swapped in -- this half is exact, not approximated. A small shade
          reading "0.0 change" isn't broken -- roto standings are RANKED, not continuous, so a
          modest boost only moves a team's points if it's enough to cross another team's total
          in that category. Try a bigger shade if you expect more movement and don't see it.</div>
        <table style="margin-top:8px"><thead><tr>
          <th class="l">Team</th><th>Before</th><th>After</th><th>Change</th>
        </tr></thead><tbody>${standRows.map(x=>`<tr>
          <td class="l">${esc(x.team)}</td><td>${nf(x.before,1)}</td><td>${nf(x.after,1)}</td>
          <td>${sgn(x.delta,1)}</td></tr>`).join("")}</tbody></table>
      </div>
      <div class="panel"><h3>2027 keeper-value impact — approximate</h3>
        <div class="note">Linear scaling of the already-computed dollar value, NOT a re-run of the
          model. Treat this as a rough feel for direction and magnitude, not a new official number.</div>
        <table style="margin-top:8px"><thead><tr>
          <th class="l">Player</th><th>Worth '27 before</th><th>Worth '27 after</th>
          <th>Surplus, all yrs before</th><th>Surplus, all yrs after</th>
        </tr></thead><tbody>${dollarRows.map(x=>`<tr>
          <td class="l">${esc(g(x.r,'name'))}</td><td>${money(g(x.r,'redraft_value'))}</td>
          <td>${money(x.shadedVal)}</td>
          <td>${sgn(adj(g(x.r,'surplus_multiyear')),0,"$")}</td>
          <td>${sgn(adj(x.shadedSurplus),0,"$")}</td></tr>`).join("")}
        </tbody></table>
      </div>`;
  } else if(rows.length){
    results = `<div class="panel"><div class="dim">Shades set. Press "recalculate" to see the impact.</div></div>`;
  }

  return `
    <div class="panel">
      <h3>Shaded players</h3>
      ${shadeTable}
      <div class="bar" style="margin-top:10px">
        <input type="search" placeholder="add a player" value="${esc(S.intuitionQ)}"
          oninput="S.intuitionQ=this.value;render()">
        <button class="act" onclick="recalcIntuition()" ${rows.length?"":"disabled"}>recalculate</button>
      </div>
      ${candidates.length ? `<div class="picker" style="margin-top:6px">${candidates.map(r=>
        `<div title="${esc(playerTooltip(r))}" onclick="addShadedPlayer(${g(r,'fg_id')})">
          <span>${esc(g(r,'name'))} <span class="dim">${esc(g(r,'team'))}</span></span>
          <span class="dim">${g(r,'role')==="PIT"?"P":"H"}</span></div>`).join("")}</div>` : ""}
      <div class="note">Your own read on a player, layered on top of the model's -- not a
        replacement for it. Talent shade moves his production rate; force-health assumes no
        missed time. Neither changes anything on the Board, Trade, or Standings tabs -- this
        stays sandboxed to this tab.</div>
    </div>
    ${results}
  `;
}

// ---------- homepage: the 5 questions an owner actually asks -----------
// Deliberately reuses existing state (S.team, S.only, S.sort, T.a) rather
// than inventing parallel state -- so a question button and the normal
// controls on the destination tab stay in sync with each other, not two
// separate sources of truth for the same filter.
const QUESTIONS = [
  {key:"keep", q:"Who should I keep?",
   d:"The model's own recommended keeper set for your team, ranked by surplus.",
   go:()=>{ S.tab="board"; S.only="keep"; S.sort="surplus_multiyear"; S.desc=true; }},
  {key:"trade", q:"Is this trade fair?",
   d:"Opens the trade evaluator with your team on one side -- pick who's involved on both.",
   go:()=>{ S.tab="trade"; if(S.team) T.a=S.team; }},
  {key:"worth", q:"What's my team worth, and how do I compare?",
   d:"Every team's keeper worth, surplus, and projected 2026 finish, sortable.",
   go:()=>{ S.tab="teams"; }},
  {key:"2027", q:"How strong is my keeper core for 2027?",
   d:"Projected 2027 standings from your CURRENT keepers alone -- not a real-auction forecast.",
   go:()=>{ S.tab="standings"; S.standSeason="keepers2027"; }},
  {key:"fa", q:"Which free agents should I grab?",
   d:"The waiver wire, priced the same way as your roster, best surplus first.",
   go:()=>{ S.tab="fa"; S.sort="surplus_multiyear"; S.desc=true; }},
];
function goQuestion(key){
  const item = QUESTIONS.find(x=>x.key===key);
  if(!item) return;
  if((key==="keep"||key==="trade") && !S.team) return;   // button is disabled in this state anyway
  item.go();
  render();
}
function homePanel(){
  const teamPicker = `<select onchange="S.team=this.value;render()" style="font-size:14px">
    <option value="">choose your team…</option>
    ${TEAMS.map(t=>`<option value="${esc(t)}" ${S.team===t?"selected":""}>${esc(t)}</option>`).join("")}
  </select>`;
  const cards = QUESTIONS.map(x=>{
    const needsTeam = (x.key==="keep"||x.key==="trade") && !S.team;
    return `<button class="qbtn" ${needsTeam?"disabled":""} onclick="goQuestion('${x.key}')"
      title="${needsTeam?esc('Pick your team above first -- this one is about your own roster.'):""}">
      <div class="qt">${esc(x.q)}</div><div class="qd">${esc(x.d)}</div>
    </button>`;}).join("");
  return `<div class="panel">
    <h3>Start here</h3>
    <div class="note">A dollar-value engine for this league's 10-team 5×5 roto keeper auction,
      built on the league's own auction history rather than generic projections. Pick your team,
      then click whichever question below is closest to what you're actually asking -- it opens
      the right screen with the right filters already set, not a blank tab you have to figure out.
      Every number on every screen has an honest error bar; read the footer at the bottom of any
      tab before treating a dollar figure as more precise than it is.</div>
    <div style="margin:12px 0 4px">${teamPicker}</div>
    <div class="qgrid">${cards}</div>
  </div>`;
}

function modelView(){
  const c=D.constants, den=c.denominators, denSe=c.denominators_se||{};
  // Was a two-way test that labelled anything not in NEG_CATS a counting stat,
  // which called AVG a counting stat. It is a rate, and higher is better.
  const RATE=new Set(["AVG","ERA","WHIP"]);
  const kind = x => !RATE.has(x) ? "counting · higher is better"
    : NEG.has(x) ? "rate · lower is better" : "rate · higher is better";
  const rows=CATS.map(x=>{
    const d=den[x], se=denSe[x];
    const dp = d<1?4:2;
    return `<tr><td class="l">${x}</td>
      <td title="1 standard error, propagated from this category's dispersion estimate (out/FINDINGS.md #26) through the same units-per-point conversion. Roughly a 68% interval; double it for something closer to 95%.">${nf(d,dp)} <span class="dim">± ${nf(se,dp)}</span></td>
      <td class="l dim">${kind(x)}</td></tr>`;}).join("");
  // PROJECTION_BASIS is overridden with the live S.basis, not the
  // build-time D.settings value -- the selector in the header can change
  // it without a rebuild, and this panel needs to say what's actually
  // showing, not what shipped in the file.
  const set=Object.entries({...D.settings, PROJECTION_BASIS: S.basis}).map(([k,v])=>{
    const label=k.toLowerCase().replace(/_/g," ");
    const help=esc(SETTING_HELP[label]||"");
    return `<div class="k" title="${help}">${label}</div>`
      + `<div class="v" title="${help}">${esc(Array.isArray(v)?v.join(", "):v)}</div>`;
  }).join("");
  const kvHelp=(label,valueHtml,help)=>
    `<div class="k" title="${esc(help)}">${label}</div><div class="v" title="${esc(help)}">${valueHtml}</div>`;
  return homePanel() + `<div class="panel"><h3>Model internals — how the numbers above are made</h3>
      <div class="note">Everything below is the engine room: skip it unless you want to see the
        arithmetic or push back on a modelling choice.</div></div>
    <div class="grid2">
    <div class="panel"><h3>Denominators — units per standings point</h3>
      <table><thead><tr>
        <th class="l" title="Roto category.">Cat</th>
        <th title="How many units of this stat buy one standings point, pooled from this league's own history — see out/FINDINGS.md #26.">Units / pt</th>
        <th class="l" title="Counting stats sum directly; rate stats (AVG/ERA/WHIP) are computed as a marginal shift against a league-average team, not the player's raw rate — out/ARCHITECTURE.md §1.2.">Kind</th>
      </tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="note">Estimated from pooled relative dispersion across
        ${D.settings.DENOM_SEASONS} team-seasons, scaled by the expected range of a
        ${D.league.n_teams}-team sample. Saves use an 8-team field because two teams punt.
        The ± figure is that estimate's own standard error, propagated through the same
        conversion -- most categories pool 30 team-seasons and land within about ±13% of
        their own value; SV (17 team-seasons, two punting teams already excluded) and
        ERA/WHIP (20, partial seasons excluded) pool fewer and run wider, around ±16-18%.
        This describes how settled the category's roto-point SCALE itself is, not how
        trustworthy any one player's own projection is.</div>
    </div>
    <div class="panel"><h3>Fitted constants</h3>
      <div class="kv">
        ${kvHelp("$ / roto point, auction scale", `$${nf(c.usd_per_roto_point_auction,2)}`, CONST_HELP.usd_per_roto_point_auction)}
        ${kvHelp("$ / roto point, redraft scale", `$${nf(c.usd_per_roto_point_redraft,2)}`, CONST_HELP.usd_per_roto_point_redraft)}
        ${kvHelp("auction intercept, roto pts", nf(c.auction_intercept,2), CONST_HELP.auction_intercept)}
        ${kvHelp("replacement level, roto pts", nf(c.replacement_roto_points,2), CONST_HELP.replacement_level)}
        ${kvHelp("top-230 budget check", `$${nf(c.budget_check_top230,0)}`, CONST_HELP.budget_check)}
        ${kvHelp("projected 2027 inflation", `${nf(INFL,3)}×`, CONST_HELP.inflation)}
        ${kvHelp("a 2027 dollar buys", nf(c.dollar_buys,3), CONST_HELP.dollar_buys)}
      </div>
      <div class="note">The intercept is a second, independent read on replacement level: a
        $0 player returns ${nf(c.auction_intercept,2)} roto points, against ${nf(c.replacement_roto_points,2)}
        from the projection route. They were never fitted to agree.</div>
    </div>
    <div class="panel"><h3>Active settings</h3><div class="kv">${set}</div>
      <div class="note">Change any of these in <code>klab/config.py</code> and rebuild with
        <code>python3 scripts/build_app.py</code>. 17% of keep/cut calls depend on
        <code>PROJECTION_BASIS</code> alone.</div></div>
    <div class="panel"><h3>What this does that a generic calculator does not</h3>
      <div class="note" style="font-size:12.5px">
        Commercial auction calculators divide a budget across a projected player pool. This one
        regresses <i>realised</i> production on <i>prices actually paid in this league</i>, busts
        included at the price paid. That buys three things: league-specific mispricing (saves are
        underpaid by +2.23 roto points per closer, conditional on competing), drift (a dollar bought
        2.5× as much in 2022 as in 2026 as keepers absorbed the talent), and contract-aware
        multi-year surplus with the +$5 extension priced as an option.
      </div></div>
  </div>`;
}

// ---------- render ----------
function render(){
  document.querySelectorAll("nav button").forEach(b=>
    b.classList.toggle("on", b.dataset.t===S.tab));
  const v=$("view");
  if(S.tab==="board") v.innerHTML=controls()+boardView(curRows());
  else if(S.tab==="fa") v.innerHTML=controls(false)+boardView(curRows(), FA_NOTE);
  else if(S.tab==="teams") v.innerHTML=teamsView();
  else if(S.tab==="contention") v.innerHTML=contentionView();
  else if(S.tab==="trade") v.innerHTML=tradeView();
  else if(S.tab==="standings") v.innerHTML=standingsView();
  else if(S.tab==="intuition") v.innerHTML=intuitionView();
  else if(S.tab==="model") v.innerHTML=modelView();
}
render();
</script>
</body>
</html>
